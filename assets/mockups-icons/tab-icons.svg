 y="454" font-size="13" font-family="Cascadia Mono, Consolas, Menlo, monospace" fill="#c9c3b2" text-anchor="middle" xml:space="preserve">Cost</text><rect x="616" y="474" width="25" height="24" rx="6" fill="#3a3832"/><text x="628" y="490" font-size="13" font-family="Cascadia Mono, Consolas, Menlo, monospace" fill="#c9c3b2" text-anchor="middle" xml:space="preserve">=</text><rect x="649" y="474" width="33" height="24" rx="6" fill="#3a3832"/><text x="665" y="490" font-size="13" font-family="Cascadia Mono, Consolas, Menlo, monospace" fill="#ff8a3d" text-anchor="middle" xml:space="preserve">>#</text><rect x="690" y="474" width="25" height="24" rx="6" fill="#3a3832"/><text x="702" y="490" font-size="13" font-family="Cascadia Mono, Consolas, Menlo, monospace" fill="#c9c3b2" text-anchor="middle" xml:space="preserve">$</text><text x="20" y="528" font-size="12" fill="#a8a28f" font-family="sans-serif">Falls back: nothing, ever. Cost: plainest look, marker adds a column.</text><text x="20" y="556" font-size="12" fill="#a8a28f" font-family="sans-serif">Context selected in every row. Wide = words, narrow = one glyph. Light and dark panels are drawn by hand; the app draws its own button background.</text></svg>
