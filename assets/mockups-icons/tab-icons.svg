adia Mono, Consolas, Menlo, monospace" fill="#d4501a" text-anchor="middle" xml:space="preserve">■ Context</text><rect x="230" y="178" width="63" height="24" rx="6" fill="#e3dfd2"/><text x="261" y="194" font-size="13" font-family="Cascadia Mono, Consolas, Menlo, monospace" fill="#3a372f" text-anchor="middle" xml:space="preserve">◊ Cost</text><rect x="36" y="214" width="25" height="24" rx="6" fill="#e3dfd2"/><text x="48" y="230" font-size="13" font-family="Cascadia Mono, Consolas, Menlo, monospace" fill="#3a372f" text-anchor="middle" xml:space="preserve">○</text><rect x="69" y="214" width="25" height="24" rx="6" fill="#e3dfd2"/><text x="81" y="230" font-size="13" font-family="Cascadia Mono, Consolas, Menlo, monospace" fill="#d4501a" text-anchor="middle" xml:space="preserve">■</text><rect x="102" y="214" width="25" height="24" rx="6" fill="#e3dfd2"/><text x="114" y="230" font-size="13" font-family="Cascadia Mono, Consolas, Menlo, monospace" fill="#3a372f" text-anchor="middle" xml:space="preserve">◊</text><rect x="616" y="178" width="93" height="24" rx="6" fill="#3a3832"/><text x="662" y="194" font-size="13" font-family="Cascadia Mono, Consolas, Menlo, monospace" fill="#c9c3b2" text-anchor="middle" xml:space="preserve">○ Overview</text><rect x="717" y="178" width="85" height="24" rx="6" fill="#3a3832"/><text x="759" y="194" font-size="13" font-family="Cascadia Mono, Consolas, Menlo, monospace" fill="#ff8a3d" text-anchor="middle" xml:space="preserve">■ Context</text><rect x="810" y="178" width="63" height="24" rx="6" fill="#3a3832"/><text x="841" y="194" font-size="13" font-family="Cascadia Mono, Consolas, Menlo, monospace" fill="#c9c3b2" text-anchor="middle" xml:space="preserve">◊ Cost</text><rect x="616" y="214" width="25" height="24" rx="6" fill="#3a3832"/><text x="628" y="230" font-size="13" font-family="Cascadia Mono, Consolas, Menlo, monospace" fill="#c9c3b2" text-anchor="middle" xml:space="preserve">○</text><rect x="649" y="214" width="25" height="24" rx="6" fill=